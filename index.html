<style>
  :root{
    --bg:#f7f8fb; --bg-elev:#ffffff; --fg:#0f1526; --fg-muted:#5a6480;
    --line:rgba(15,21,38,.10); --accent:#1f6feb; --accent-soft:rgba(31,111,235,.10);
    --shadow:0 1px 2px rgba(15,21,38,.05), 0 12px 32px -12px rgba(15,21,38,.18);
    --radius:16px; --maxw:960px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1020; --bg-elev:#121a2e; --fg:#eaeefb; --fg-muted:#9aa6c4;
      --line:rgba(234,238,251,.12); --accent:#5aa2ff; --accent-soft:rgba(90,162,255,.12);
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 48px -20px rgba(0,0,0,.75);
    }
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100dvh;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(60rem 40rem at 82% -12%, var(--accent-soft), transparent 60%),
      radial-gradient(50rem 34rem at -10% 8%, var(--accent-soft), transparent 62%);
  }
  a{color:inherit}
  .wrap{width:100%; max-width:var(--maxw); margin-inline:auto; padding-inline:clamp(1.15rem,5vw,2rem)}

  /* header */
  header{padding-block:clamp(1.1rem,3vw,1.6rem)}
  .brand{display:flex; align-items:center; gap:.7rem; text-decoration:none; width:max-content}
  .mark{
    width:38px; height:38px; flex:0 0 auto; border-radius:11px; display:grid; place-items:center;
    background:linear-gradient(140deg,var(--accent),#7c5cff); color:#fff;
    font-weight:700; font-size:.9rem; letter-spacing:.02em; box-shadow:var(--shadow);
  }
  .brand b{font-size:1rem; font-weight:650; letter-spacing:-.01em}
  .brand span{display:block; font-size:.78rem; color:var(--fg-muted); font-weight:450; line-height:1.3}

  /* hero */
  main{flex:1 0 auto}
  .hero{padding-block:clamp(2.6rem,10vw,6rem)}
  h1{
    margin:0 0 .7rem; font-size:clamp(2.4rem,8vw,4.2rem); line-height:1.06;
    font-weight:700; letter-spacing:-.032em; overflow-wrap:break-word;
  }
  .tagline{
    margin:0; font-size:clamp(1.05rem,2.6vw,1.32rem); font-weight:550;
    letter-spacing:-.01em;
    background:linear-gradient(100deg,var(--accent),#7c5cff); -webkit-background-clip:text;
    background-clip:text; color:transparent; width:max-content; max-width:100%;
  }

  /* cards */
  .cards{
    list-style:none; margin:clamp(2.2rem,7vw,3.2rem) 0 0; padding:0;
    display:grid; gap:clamp(.75rem,2vw,1rem);
    grid-template-columns:repeat(auto-fit,minmax(min(100%,255px),1fr));
  }
  .card{
    display:flex; align-items:center; gap:.9rem; padding:1.05rem 1.15rem;
    background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); text-decoration:none; color:inherit;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-3px); border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
    box-shadow:0 1px 2px rgba(15,21,38,.06), 0 20px 40px -18px rgba(31,111,235,.45);
  }
  .card:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
  .icon{
    width:42px; height:42px; flex:0 0 auto; border-radius:12px; display:grid; place-items:center;
    background:var(--accent-soft); color:var(--accent);
  }
  .icon svg{width:21px; height:21px; display:block}
  .card-t{display:block; font-weight:600; font-size:.98rem; letter-spacing:-.01em}
  .card-s{display:block; font-size:.85rem; color:var(--fg-muted); overflow-wrap:anywhere}
  .arrow{margin-left:auto; color:var(--fg-muted); flex:0 0 auto; transition:transform .18s ease}
  .card:hover .arrow{transform:translateX(3px); color:var(--accent)}

  /* footer */
  footer{
    margin-top:clamp(2.5rem,8vw,4.5rem); padding-block:1.6rem; border-top:1px solid var(--line);
    font-size:.83rem; color:var(--fg-muted);
  }
  .foot{display:flex; flex-wrap:wrap; gap:.5rem 1.2rem; align-items:center; justify-content:space-between}
  .foot a{text-decoration:none; border-bottom:1px solid transparent}
  .foot a:hover{color:var(--accent); border-bottom-color:currentColor}

  h1 br{display:none}
  @media (max-width:430px){h1 br{display:inline}}

  @media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
